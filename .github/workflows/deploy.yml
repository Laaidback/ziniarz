name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN rights needed by the Pages actions (the test job narrows them).
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      # Render references were made on macOS; Linux text rendering may differ slightly, so a failure here
      # must not block the deploy. npm test skips them in CI; this step runs them strictly and only reports.
      - name: Render references (informational)
        id: references
        continue-on-error: true
        run: REFERENCE_STRICT=1 npx vitest run --project browser src/print/reference.browser.test.ts
      - name: Upload render differences
        if: steps.references.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: roznice-renderu
          path: test-output/reference/
          if-no-files-found: warn
      - name: End-to-end tests (only when the script exists)
        run: |
          if [ "$(npm pkg get scripts.test:e2e)" != "{}" ]; then
            npm run test:e2e
          else
            echo "No test:e2e script yet, skipping."
          fi

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6
      # Google ids for "Dysk Google" (README); without them the site has no Drive buttons.
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.GOOGLE_APP_ID }}
      - run: npm run check:dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
